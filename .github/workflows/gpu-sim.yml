name: CUDA tests (simulated H100)

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the CUDA code and runs the unit tests on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behaviour or timing, so it complements real-GPU testing.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'main.cu'
      - 'Makefile'
      - '.github/workflows/gpu-sim.yml'

concurrency:
  group: gpu-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cuda-sim:
    name: CUDA 13.0, simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@a1b9d4237411f9b2b0e0bb895b4d83377f336a7b # v0.1.9
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      # The simulator runs PTX only and needs a shared CUDA runtime, so the
      # default sm_80 is replaced by compute_90 PTX and -cudart shared.
      - name: Build
        run: |
          make -j3 NVCC=/usr/local/cuda-13.0/bin/nvcc ARCH=compute_90 \
               NVCCFLAGS="-O2 -std=c++17 -cudart shared" \
               build/radix_sort $(for t in histogram_test integration_test scatter_test radix_sort_test test_transpose test_scan test_global_offsets scatter_demo; do echo build/$t; done)

      # Each program must really run on the simulated device: it has to exit
      # with 0, the output has to show the virtual GPU, and the program's own
      # pass line has to be there, so an empty or skipped run cannot go green.
      - name: Unit tests and complete sort
        run: |
          set -o pipefail
          run() {
            local prog="$1" marker="$2"
            shift 2
            vgpu run "./build/$prog" "$@" 2>&1 | tee "build/$prog.log"
            grep -q 'virtual GPU platform initialized' "build/$prog.log"
            grep -q "$marker" "build/$prog.log"
            ! grep -q '^ERROR\|failed' "build/$prog.log"
          }
          run histogram_test 'GPU HISTOGRAM VALID'
          run integration_test 'INTEGRATION VALID'
          run test_transpose 'PASS: All 12'
          run test_scan 'PASS: All'
          run test_global_offsets 'PASS: All'
          run scatter_test 'SCATTER UNIT TESTS PASSED'
          run scatter_demo 'Outputs match: true'
          run radix_sort_test 'RADIX SORT VALID'
          run radix_sort 'PASS: complete radix sort matches CPU'
